name: windows-port-ci

on:
  push:
    branches: ["windows-*"]
  pull_request:
  schedule:
    # Weekly: catch upstream drift before it becomes a surprise.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/Homebrew/brew.git

jobs:
  drift:
    name: Drift — rebase onto newest release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase port commits onto newest Homebrew release tag
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch --no-tags upstream main

          BASE=$(git merge-base upstream/main HEAD)
          echo "port base commit : $BASE"

          LATEST=$(curl -fsSL https://api.github.com/repos/Homebrew/brew/releases/latest | jq -r '.tag_name')
          echo "newest release   : $LATEST"

          git fetch --no-tags upstream "refs/tags/${LATEST}:refs/tags/${LATEST}"
          TARGET=$(git rev-parse "${LATEST}^{commit}")
          echo "target commit    : $TARGET"

          if [ "$TARGET" = "$BASE" ]; then
            echo "::notice::Already based on the newest release tag ($LATEST). Nothing to do."
            exit 0
          fi

          git config user.name  "windows-port-ci"
          git config user.email "ci@localhost"

          if git rebase --onto "$TARGET" "$BASE"; then
            echo "::notice::Rebase onto $LATEST is clean — port is current through that tag."
          else
            echo "::error::Rebase onto $LATEST conflicts. The port needs updating."
            git diff --name-only --diff-filter=U | sed 's/^/  conflicted: /'
            exit 1
          fi

      - name: Report resulting head
        if: always()
        run: git log --oneline -1 || true

  syntax:
    name: Syntax — pinned portable Ruby 4.0.5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the pinned portable Ruby (same build the launcher pins)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/oneclick/rubyinstaller2/releases/download/RubyInstaller-4.0.5-1/rubyinstaller-4.0.5-1-x64.7z'
          Invoke-WebRequest -Uri $url -OutFile ruby.7z
          & 'C:\Program Files\7-Zip\7z.exe' x ruby.7z -oC:\ruby-tmp -y | Out-Null
          $ruby = Get-ChildItem 'C:\ruby-tmp' -Recurse -Filter 'ruby.exe' | Select-Object -First 1
          if (-not $ruby) { throw 'ruby.exe not found in extracted archive' }
          $ruby.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $ruby.FullName --version

      - name: ruby -c on every changed .rb file
        shell: pwsh
        run: |
          $base = (git merge-base origin/main HEAD).Trim()
          $files = @(git diff --name-only $base HEAD -- '*.rb')
          if ($files.Count -eq 0) { Write-Host 'no Ruby files changed'; exit 0 }
          $fail = 0
          foreach ($f in $files) {
            Write-Host "== $f"
            ruby -c $f
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail

      - name: bash -n on every changed .sh file
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git merge-base origin/main HEAD)
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD -- '*.sh')
          if [ ${#FILES[@]} -eq 0 ]; then echo "no shell files changed"; exit 0; fi
          for f in "${FILES[@]}"; do
            echo "== $f"
            bash -n "$f"
          done
